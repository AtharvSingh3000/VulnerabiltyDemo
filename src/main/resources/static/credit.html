<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --input-focus: rgba(79, 70, 229, 0.1);
            --error-color: #ef4444;
            --error-bg: #fee2e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-background);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .error-message {
            display: none;
            color: var(--error-color);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            position: absolute;
            bottom: -1.25rem;
            left: 0;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--text-primary);
            background-color: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        .box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .expiry-month {
            width: 40%;
        }

        #expiryYear {
            width: 60%;
            margin-bottom: 0;
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        input.error {
            border-color: var(--error-color);
            background-color: var(--error-bg);
        }

        input.error + .error-message {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .box {
                flex-direction: column;
                gap: 0;
            }

            .expiry-month,
            #expiryYear {
                width: 100%;
            }

            #expiryYear {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Credit Card</h1>
        <div class="container">
            <div class="input-group">
                <input id="cardHolder" type="text" placeholder="Card Holder" required>
                <span class="error-message">Please enter card holder name</span>
            </div>

            <div class="input-group">
                <input id="cardNumber" type="text" placeholder="Card Number" required 
                       maxlength="19" onkeyup="formatCardNumber(this)">
                <span class="error-message">Please enter a valid 16-digit card number</span>
            </div>
            
            <div class="box">
                <select id="expiryMonth" class="expiry-month" required>
                    <option value="" disabled selected>Month</option>
                    <option value="01">01</option>
                    <option value="02">02</option>
                    <option value="03">03</option>
                    <option value="04">04</option>
                    <option value="05">05</option>
                    <option value="06">06</option>
                    <option value="07">07</option>
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
                
                <input id="expiryYear" type="text" placeholder="Year (YYYY)" maxlength="4" required>
            </div>
            
            <div class="input-group">
                <input id="cvv" type="text" placeholder="CVV" maxlength="3" required 
                       onkeypress="return onlyNumbers(event)">
                <span class="error-message">Please enter a valid 3-digit CVV</span>
            </div>
            
            <button class="btn" onclick="submitForm()">Submit</button>
        </div>
    </div>

    <script>
        // Allow only numbers in input fields
        function onlyNumbers(event) {
            const charCode = (event.which) ? event.which : event.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57)) {
                return false;
            }
            return true;
        }

        // Format card number with spaces
        function formatCardNumber(input) {
            // Remove any non-digit characters
            let value = input.value.replace(/\D/g, '');
            
            // Limit to 16 digits
            value = value.substring(0, 16);
            
            // Add spaces every 4 digits
            const formattedValue = value.replace(/(\d{4})(?=\d)/g, '$1 ');
            
            input.value = formattedValue;

            // Validate length
            if (value.length < 16) {
                input.classList.add('error');
            } else {
                input.classList.remove('error');
            }
        }

        // Validate CVV
        document.getElementById('cvv').addEventListener('input', function(e) {
            const value = e.target.value.replace(/\D/g, '');
            e.target.value = value;
            
            if (value.length !== 3) {
                e.target.classList.add('error');
            } else {
                e.target.classList.remove('error');
            }
        });

        function submitForm() {
            const cardHolder = document.getElementById('cardHolder').value;
            const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const expiryMonth = document.getElementById('expiryMonth').value;
            const expiryYear = document.getElementById('expiryYear').value;
            const cvv = document.getElementById('cvv').value;

            // Validate all fields
            if (!cardHolder || !cardNumber || !expiryMonth || !expiryYear || !cvv) {
                alert("Please fill in all fields.");
                return;
            }

            // Validate card number length
            if (cardNumber.length !== 16) {
                alert("Please enter a valid 16-digit card number.");
                return;
            }

            // Validate CVV length
            if (cvv.length !== 3) {
                alert("Please enter a valid 3-digit CVV.");
                return;
            }

            const expiryDate = `${expiryMonth}/${expiryYear}`;
            
            const creditCardData = {
                cardHolderName: cardHolder,
                cardNumber: cardNumber,
                expiryDate: expiryDate,
                cvv: cvv
            };

            fetch('http://10.180.5.184:8086/credit/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(creditCardData)
            })
            .then(response => response.json())
            .then(data => {
                alert('Credit card details submitted successfully!');
            })
            .catch(error => {
                alert('Error: ' + error);
            });
        }
    </script>
</body>
</html>
