<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Demo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .page-title {
            text-align: center;
            color: #2d3436;
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 15px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, #6e8efb, #a777e3);
            border-radius: 2px;
        }

        .forms-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .forms-container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            padding: 25px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .vulnerable-section {
            background: linear-gradient(135deg, #fff5f5, #ffe5e5);
            border: 2px solid #ffcdd2;
        }

        .safe-section {
            background: linear-gradient(135deg, #f5fff5, #e5ffe5);
            border: 2px solid #c8e6c9;
        }

        .form-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2d3436;
        }

        .vulnerable-section .section-title {
            color: #e74c3c;
        }

        .safe-section .section-title {
            color: #27ae60;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2d3436;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .vulnerable-section input[type="text"]:focus {
            border-color: #e74c3c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }

        .safe-section input[type="text"]:focus {
            border-color: #27ae60;
            outline: none;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .vulnerable-section button {
            background: #e74c3c;
            color: white;
        }

        .vulnerable-section button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .safe-section button {
            background: #27ae60;
            color: white;
        }

        .safe-section button:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        .result-container {
            margin-top: 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #xssResult {
            width: 100%;
            height: 200px;
            border: none;
            background: white;
            transition: all 0.3s ease;
        }

        .info-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }

        .vulnerable-badge {
            background: #fff3f3;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .safe-badge {
            background: #f0fff4;
            color: #27ae60;
            border: 1px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="page-title">XSS Demonstration</h2>
        
        <div class="forms-container">
            <!-- Vulnerable Form -->
            <div class="form-section vulnerable-section">
                <h3 class="section-title">
                    <i class="fas fa-exclamation-triangle"></i>
                    Vulnerable Version
                    <span class="info-badge vulnerable-badge">
                        <i class="fas fa-shield-alt"></i> Unsafe
                    </span>
                </h3>
                <form id="xssForm">
                    <div class="input-group">
                        <label for="message">Enter Message:</label>
                        <input type="text" id="message" name="message" 
                               placeholder="Type your message here..." required>
                    </div>
                    <button type="button" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                        Send Message
                    </button>
                </form>
            </div>

            <!-- Safe Form -->
            <div class="form-section safe-section">
                <h3 class="section-title">
                    <i class="fas fa-shield-alt"></i>
                    Protected Version
                    <span class="info-badge safe-badge">
                        <i class="fas fa-check-circle"></i> Safe
                    </span>
                </h3>
                <form id="safeXssForm">
                    <div class="input-group">
                        <label for="safeMessage">Enter Message:</label>
                        <input type="text" id="safeMessage" name="safeMessage" 
                               placeholder="Type your message here..." required>
                    </div>
                    <button type="button" onclick="sendSafeMessage()">
                        <i class="fas fa-paper-plane"></i>
                        Send Message
                    </button>
                </form>
            </div>
        </div>

        <div class="result-container">
            <iframe id="xssResult" title="Message Result"></iframe>
        </div>
    </div>

    <script>
        function sendMessage() {
            const message = document.getElementById('message').value;
            document.getElementById('xssResult').style.display = "block";
            document.getElementById('xssResult').src = `/login/message?msg=${encodeURIComponent(message)}`;
        }

        function sendSafeMessage() {
            const safeMessage = document.getElementById('safeMessage').value;
            document.getElementById('xssResult').style.display = "block";
            document.getElementById('xssResult').src = `/login/safe-message?msg=${encodeURIComponent(safeMessage)}`;
        }
    </script>
</body>
</html>
