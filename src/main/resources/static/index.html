<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom right, #6dd5ed, #2193b0);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 36px;
        }

        p {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .links {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .links {
                grid-template-columns: 1fr;
            }
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 10px;
            transition: 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .links a:hover {
            background: white;
            color: #2193b0;
            transform: scale(1.05);
        }

        .links a i {
            margin-right: 10px;
            font-size: 24px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Explore Vulnerability Demonstrations</h1>
        <p>Select a page to navigate:</p>
        <div class="links">
            <a href="/login.html"><i class="fas fa-key"></i> Login Page</a>
            <a href="/attack.html"><i class="fas fa-shield-alt"></i> Attack Page</a>
            <a href="/command-injection.html"><i class="fas fa-terminal"></i> Command Injection</a>
            <a href="/xss.html"><i class="fas fa-radiation"></i> XSS Page</a>
            <a href="/dom-xss.html"><i class="fas fa-sitemap"></i> DOM-XSS Page</a>
            <a href="/credit.html"><i class="fas fa-credit-card"></i> Credit Card</a>
            <a href="/viewcredit.html"><i class="fas fa-eye"></i> Credit View</a>
            <a href="/newview.html"><i class="fas fa-plus-circle"></i> Credit New View</a>
            <a href="/fetch-resource.html"><i class="fas fa-cloud-download-alt"></i> SSRF-Attack</a>
        </div>
        <footer>
            &copy; 2024 CDAC Bengaluru. All rights reserved.
        </footer>
    </div>
</body>
</html>
